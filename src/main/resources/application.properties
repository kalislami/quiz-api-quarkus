quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=validate

%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/quiz_db}
%dev.quarkus.datasource.username=${DB_USER:quiz_user}
%dev.quarkus.datasource.password=${DB_PASSWORD:quiz_pass}

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:quiz_test_db;MODE=MySQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa

quarkus.http.port=${HTTP_PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,DELETE

quarkus.smallrye-openapi.info-title=Quiz API
quarkus.smallrye-openapi.info-description=REST API for managing quiz sets and questions built with Quarkus.
