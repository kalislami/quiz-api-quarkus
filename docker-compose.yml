services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quiz_db}
      MYSQL_USER: ${MYSQL_APP_USER:-quiz_user}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-quiz_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  quiz-api:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-quiz_db}
      DB_USER: ${MYSQL_APP_USER:-quiz_user}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:-quiz_pass}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

volumes:
  mysql_data:
